# ddd4j-quarkus-extension-monitor 测试配置
# 机器人发送器构造参数（键名与 MonitorConfig 的 ConfigMapping 结构一致：
# wecom.key / feishu.webhook-url / dingtalk.token+secret；测试不实际发送消息）
ddd4j.monitor.log.app.name=test-app
ddd4j.monitor.log.dingtalk.token=test-token
ddd4j.monitor.log.dingtalk.secret=test-secret
ddd4j.monitor.log.wecom.key=test-wecom-key
ddd4j.monitor.log.feishu.webhook-url=https://example.com/feishu-webhook
ddd4j.monitor.log.feishu.secret=test-feishu-secret
