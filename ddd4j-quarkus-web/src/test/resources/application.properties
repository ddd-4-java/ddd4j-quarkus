# ddd4j-quarkus-web 测试配置：最小化启动，关闭不需要的 DevServices
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.enabled=false
quarkus.flyway.enabled=false
# 健康端点配置
quarkus.smallrye-health.root-path=/q/health
# ddd4j web 默认配置（public paths 包含 health 端点）
ddd4j.web.public-paths=/health,/q/health/**
ddd4j.web.authentication-mode=DISABLED