# SmallRye JWT：测试用 RSA 密钥对（与 src/test/resources/{privateKey,publicKey}.pem 对应）
# 注意：smallrye-jwt 4.6.x 的 Jwt.sign() 读取的键名是 smallrye.jwt.sign.key.location
# （点分隔），旧键 smallrye.jwt.sign.key-location 已不再被签名路径读取
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://example.com/issuer
smallrye.jwt.sign.key.location=privateKey.pem

# 测试资源 Bean（JwtSubjectTestResource）会被 Arc 索引，关闭未使用 Bean 移除避免误删
quarkus.arc.remove-unused-beans=false
