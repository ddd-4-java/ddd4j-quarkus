# mq-core 测试配置：默认关闭 MQ（registrar onStart 应跳过）；
# broker/namespace 显式写入以验证 Ddd4jMQCdiProducer 从 application.properties 读取。
ddd4j.mq.enabled=false
ddd4j.mq.broker=disruptor
ddd4j.mq.namespace=test-namespace

# 测试夹具 Bean（TestMQClient/TestMqListener）没有静态注入点，防止被 Arc 当作未使用 Bean 移除
quarkus.arc.remove-unused-beans=false

# 测试不涉及数据库：关闭 Hibernate/DevServices（parent 默认依赖引入 Panache+MySQL，
# 避免 Quarkus 3.36.3 与主仓 hibernate 6.6.40 的 BootLogging.BOOT_LOGGER 不兼容）
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.enabled=false
