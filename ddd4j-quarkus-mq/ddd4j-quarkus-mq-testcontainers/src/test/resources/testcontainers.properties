# Testcontainers 全局配置（classpath 根目录，testcontainers-java 自动加载）。
#
# 本仓库所有 broker 集成测试通过 QuarkusTestResourceLifecycleManagerWrapper +
# AbstractTestContainerFixture 启动并关闭自己拥有的容器。
#
# Testcontainers reusable containers 是实验性能力，测试基线显式关闭。开发者即使在用户级
# 配置中启用，也必须由本地代码显式调用 withReuse(true) 才会生效；仓库 fixture 不做该调用。
testcontainers.reuse.enable=false
