# Testcontainers 全局配置（classpath 根目录，testcontainers-java 自动加载）。
#
# 本仓库所有 broker 集成测试通过 QuarkusTestResourceLifecycleManagerWrapper +
# AbstractTestContainerFixture(withReuse(true)) 启动容器。
#
# testcontainers.reuse.enable=true：
#   - 本地开发：同一镜像/配置的容器在测试间复用，避免反复启停（需 Docker daemon 运行）；
#     手动清理：docker rm -f $(docker ps -aq --filter "label=testcontainers")
#   - CI：复用同一次运行内的容器；跨 job 复用由 ~/.testcontainers.properties 控制
#     （见 .github/workflows/ci.yml 的 infrastructure-integration job）。
#
# 配置优先级（高 → 低）：
#   1. JVM 系统属性（-Dtestcontainers.reuse.enable=true）
#   2. 环境变量（TESTCONTAINERS_REUSE_ENABLE）
#   3. ~/.testcontainers.properties（用户级，优先于本文件）
#   4. classpath 根目录 testcontainers.properties（本文件）
testcontainers.reuse.enable=true
