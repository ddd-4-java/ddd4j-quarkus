# ddd4j-quarkus Testcontainers RocketMQ broker config (single-container namesrv+broker mode)
# 对齐 ddd4j-javalin-testcontainers rocketmq/broker.conf：
# brokerIP1=127.0.0.1 使 broker 向 namesrv 公告宿主机可达地址（配合固定 10911 端口映射）；
# autoCreateTopicEnable / autoCreateSubscriptionGroup 供测试免运维。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = 127.0.0.1
listenPort = 10911
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
defaultTopicQueueNums = 4
