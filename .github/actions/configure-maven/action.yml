---
name: 'Configure Maven and verify ddd4j snapshot'
description: >-
  Install MAVEN_SETTINGS_XML without logging credentials and verify the exact
  ddd4j snapshot from an empty Maven repository.

inputs:
  maven-settings-xml:
    description: 'Base64-encoded Maven settings.xml'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Configure Maven settings
      shell: bash
      env:
        MAVEN_SETTINGS_XML: ${{ inputs.maven-settings-xml }}
      run: |
        if [ -z "$MAVEN_SETTINGS_XML" ]; then
          echo "::error::MAVEN_SETTINGS_XML organization secret is missing"
          exit 1
        fi
        install -d -m 700 "$HOME/.m2"
        umask 077
        P5A_SETTINGS_TMP=''
        cleanup_settings_temp() {
          if [ -n "$P5A_SETTINGS_TMP" ]; then
            rm -f "$P5A_SETTINGS_TMP"
          fi
        }
        trap cleanup_settings_temp EXIT
        P5A_SETTINGS_TMP="$(mktemp "$HOME/.m2/settings.xml.XXXXXX")"
        P5A_MAVEN_SERVER_ID='2624322-snapshot-3EoOv3'
        if ! printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode \
          > "$P5A_SETTINGS_TMP"; then
          echo "::error::MAVEN_SETTINGS_XML is not valid base64"
          exit 1
        fi
        if ! grep -q "<id>${P5A_MAVEN_SERVER_ID}</id>" "$P5A_SETTINGS_TMP"; then
          echo "::error::MAVEN_SETTINGS_XML required server is missing"
          exit 1
        fi
        chmod 600 "$P5A_SETTINGS_TMP"
        mv -f "$P5A_SETTINGS_TMP" "$HOME/.m2/settings.xml"
        P5A_SETTINGS_TMP=''
        trap - EXIT

    - name: Verify remote ddd4j snapshot
      shell: bash
      run: |
        DDD4J_QUARKUS_CI_REPO="$RUNNER_TEMP/ddd4j-quarkus-maven-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        install -d -m 700 "$DDD4J_QUARKUS_CI_REPO"
        printf 'DDD4J_QUARKUS_CI_REPO=%s\n' "$DDD4J_QUARKUS_CI_REPO" >> "$GITHUB_ENV"
        ./mvnw -B -U -f .github/maven/ddd4j-remote-consumer/pom.xml \
          -Dmaven.repo.local="$DDD4J_QUARKUS_CI_REPO" \
          -Dmaven.resolver.transport=wagon \
          dependency:go-offline
