# CI: Build, test, and integration test for ddd4j-quarkus (feature/4.0.x — Maven 4 / Java 21)
#
# ddd4j-quarkus resolves its published ddd4j 3.0.x SNAPSHOT from the configured
# remote Maven repository. Both Maven jobs verify this from an empty cache first.
#
# ─────────────────────────────────────────────────────────────────────────────
# P1-5 重构（2026-09-02）：拆分 infrastructure-integration 为 13 个 broker matrix jobs
# ─────────────────────────────────────────────────────────────────────────────
# - 13 个 broker 集成测试失败保持阻断，不被忽略
# - 每个 broker 独立 matrix job：单个 broker 失败立即阻塞合并
# - fail-fast: false：一个 broker 失败不会取消其余 broker 的测试
# - 每个 broker 独立上传报告（integration-reports-<broker>）便于追溯
# - Java matrix 锁定为 21（与 feature/4.0.x 版本线对齐，P1-4 reconcile）
#
# 版本对齐背景：
#   feature/4.0.x 解析已发布的 ddd4j.version=3.0.x.20260630-SNAPSHOT。
#   - feature/3.3.x：quarkus-bom 3.37.4 ↔ ddd4j 2.0.x（Java 17）
#   - feature/4.0.x：quarkus-bom 3.38.2 ↔ ddd4j 3.0.x（Java 21）
# ─────────────────────────────────────────────────────────────────────────────

name: Verify ddd4j-quarkus

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          filter_mode: nofilter

  unit-and-contract:
    name: Java ${{ matrix.java }} verify
    runs-on: ubuntu-latest
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        java: ['21'] # P1-4 reconcile: feature/4.0.x 锁定 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Configure Maven and verify ddd4j snapshot
        uses: ./.github/actions/configure-maven
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Verify Quarkus BOM arbitration
        run: python3 ddd4j-quarkus-dependencies/src/test/python/verify_bom_arbitration.py
      - name: Verify (unit + contract)
        run: |
          set -o pipefail
          ./mvnw -B verify -DskipTests=false | tee quarkus-verify.log
      - name: Reject ignored Quarkus configuration
        run: python3 scripts/verify-quarkus-log.py quarkus-verify.log
      - name: Require executed unit and contract tests
        run: python3 scripts/verify-test-reports.py .

  auth-production:
    name: Auth runner production smoke (Java 21)
    runs-on: ubuntu-latest
    needs: [workflow-lint, unit-and-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure Maven and verify ddd4j snapshot
        uses: ./.github/actions/configure-maven
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Package runnable auth samples
        run: |
          set -o pipefail
          ./mvnw -B package -DskipTests=false \
            -pl ddd4j-quarkus-samples/ddd4j-quarkus-sample-auth-satoken,ddd4j-quarkus-samples/ddd4j-quarkus-sample-auth-shiro -am \
            | tee auth-package.log
      - name: Verify auth runner jars
        run: ./scripts/verify-auth-runners.sh auth-package.log
      - name: Require executed auth journey tests
        run: >-
          python3 scripts/verify-test-reports.py
          --require-class io.ddd4j.quarkus.sample.auth.satoken.AuthJourneyTest
          --require-class io.ddd4j.quarkus.sample.auth.shiro.AuthJourneyTest
          ddd4j-quarkus-samples/ddd4j-quarkus-sample-auth-satoken
          ddd4j-quarkus-samples/ddd4j-quarkus-sample-auth-shiro

  broker-integration:
    name: Broker ${{ matrix.coverage }} (${{ matrix.broker }})
    runs-on: ubuntu-latest
    needs: [workflow-lint, unit-and-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - broker: activemq
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.activemq.ActiveMqQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.activemq.ActiveMqQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: disruptor
            coverage: in-process-roundtrip
            test_class: io.ddd4j.quarkus.mq.disruptor.DisruptorQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.disruptor.DisruptorQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: kafka
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.kafka.KafkaQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.kafka.KafkaQuarkusIntegrationTest#shouldPublishAndConsumeEventEndToEnd
          - broker: mqtt
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.mqtt.MqttQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.mqtt.MqttQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: mqtt-mica
            coverage: linux-roundtrip-mac-arm64-skip
            test_class: io.ddd4j.quarkus.mq.mqttmica.MicaMqttQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.mqttmica.MicaMqttQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: nats
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.nats.NatsQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.nats.NatsQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: ons
            coverage: commercial-config-only
            test_class: io.ddd4j.quarkus.mq.ons.OnsQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.ons.OnsQuarkusIntegrationTest#shouldInjectMQClient
          - broker: pulsar
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.pulsar.PulsarQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.pulsar.PulsarQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: rabbitmq
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.rabbit.RabbitMqQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.rabbit.RabbitMqQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: redis-stream
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.redisstream.RedisStreamQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.redisstream.RedisStreamQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: rocketmq
            coverage: public-roundtrip
            test_class: io.ddd4j.quarkus.mq.rocket.RocketMqQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.rocket.RocketMqQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: sqs
            coverage: emulated-roundtrip
            test_class: io.ddd4j.quarkus.mq.sqs.SqsQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.sqs.SqsQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
          - broker: tdmq
            coverage: fallback-contract
            test_class: io.ddd4j.quarkus.mq.tdmq.TdmqQuarkusIntegrationTest
            required_test: io.ddd4j.quarkus.mq.tdmq.TdmqQuarkusIntegrationTest#shouldPublishAndConsumeOrderCreatedEventEndToEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure Maven and verify ddd4j snapshot
        uses: ./.github/actions/configure-maven
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Require Docker for broker integration
        run: docker info
      - name: Run broker integration tests (${{ matrix.broker }})
        run: ./mvnw -B verify -DskipTests=false -pl ddd4j-quarkus-mq/ddd4j-quarkus-mq-${{ matrix.broker }} -am
      - name: Require executed broker integration class (${{ matrix.broker }})
        run: >-
          python3 scripts/verify-test-reports.py
          --require-class "${{ matrix.test_class }}"
          --require-test "${{ matrix.required_test }}"
          ddd4j-quarkus-mq/ddd4j-quarkus-mq-${{ matrix.broker }}
      - name: Upload integration test reports (${{ matrix.broker }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ matrix.broker }}
          path: |
            **/target/failsafe-reports/*.txt
            **/target/failsafe-reports/TEST-*.xml
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
