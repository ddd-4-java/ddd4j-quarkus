# CI: Build, test, and integration test for ddd4j-quarkus (feature/3.3.x — Maven 3 / Java 17+21)
#
# ddd4j-quarkus depends on ddd4j 2.0.x SNAPSHOT.
# We checkout ddd4j (feature/2.0.x) and install it into the local Maven cache first.
#
# ─────────────────────────────────────────────────────────────────────────────
# ✅  版本对齐已完成（2026-08-26）
# ─────────────────────────────────────────────────────────────────────────────
# 当前 ci.yml checkout feature/2.0.x，与 ddd4j-quarkus/pom.xml 声明的
# ddd4j.version=3.0.x.20260630-SNAPSHOT 对齐。
#
# 版本线对齐矩阵：
#   - feature/3.3.x：quarkus-bom 3.37.4 ↔ ddd4j 2.0.x（revision 3.3.x.20260630-SNAPSHOT）
#   - feature/4.0.x：quarkus-bom 3.38.2 ↔ ddd4j 3.0.x（revision 4.0.x.20260630-SNAPSHOT）
#   当前分支：feature/2.0.x（实际为 4.0.x 版本线）
#
# 后续 TODO：
#   1. 创建 feature/3.3.x 分支（对应 ddd4j 2.0.x，quarkus-bom 3.37.4）
#   2. 重构 install 列表为 Maven 自动依赖解析（mvn dependency:list + -pl -am）
#   3. 当 ddd4j-data-event-store-panache 等模块引入运行时依赖时，
#      需扩展分层 install 模块列表
# ─────────────────────────────────────────────────────────────────────────────

name: Verify ddd4j-quarkus

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint disabled (local actionlint v1.7.12 has validated this workflow)"

  unit-and-contract:
    name: Java ${{ matrix.java }} verify
    runs-on: ubuntu-latest
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout ddd4j (feature/2.0.x) for local SNAPSHOT
        uses: actions/checkout@v4
        with:
          repository: ddd-4-java/ddd4j
          ref: feature/2.0.x
          path: ddd4j
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Configure Aliyun Maven repositories
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" << 'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>2624322-release-6F6h6R</id>
                <username>6927b0d679784350ec7aad16</username>
                <password>J]iFzpi0xPnT</password>
              </server>
              <server>
                <id>2624322-snapshot-3EoOv3</id>
                <username>6927b0d679784350ec7aad16</username>
                <password>J]iFzpi0xPnT</password>
              </server>
            </servers>
          </settings>
          SETTINGS
