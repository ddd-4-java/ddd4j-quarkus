# CI: Build, test, and integration test for ddd4j-quarkus (feature/3.3.x — Maven 3 / Java 17+21)
#
# ddd4j-quarkus depends on ddd4j 2.0.x SNAPSHOT.
# We checkout ddd4j (feature/2.0.x) and install it into the local Maven cache first.
# The checkout + Aliyun config + install sequence is shared via the composite
# action `.github/actions/install-ddd4j` (used by both jobs below).
#
# ─────────────────────────────────────────────────────────────────────────────
# P1-5 重构（2026-09-02）：新增 13 个 broker matrix jobs
# ─────────────────────────────────────────────────────────────────────────────
# - 每个 broker 独立 matrix job：单个 broker 失败立即阻塞合并
# - fail-fast: false：一个 broker 失败不会取消其余 broker 的测试
# - 每个 broker 独立上传报告（integration-reports-<broker>）便于追溯
# - Java matrix 保留 ['17', '21']（feature/3.3.x 版本线默认 Java 17）
#
# 版本线对齐矩阵（2026-08-26 完成）：
#   当前 ci.yml 经 composite action checkout feature/2.0.x，与
#   ddd4j-quarkus/pom.xml 声明的 ddd4j.version=2.0.x.20260630-SNAPSHOT 对齐。
#   - feature/3.3.x：quarkus-bom 3.37.4 ↔ ddd4j 2.0.x（revision 3.3.x.20260630-SNAPSHOT）
#   - feature/4.0.x：quarkus-bom 3.38.2 ↔ ddd4j 3.0.x（revision 4.0.x.20260630-SNAPSHOT）
#
# 后续 TODO：
#   1. 重构 install 列表为 Maven 自动依赖解析（mvn dependency:list + -pl -am）
#   2. 当 ddd4j-data-event-store-panache 等模块引入运行时依赖时，
#      需扩展分层 install 模块列表
# ─────────────────────────────────────────────────────────────────────────────

name: Verify ddd4j-quarkus

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint disabled (local actionlint v1.7.12 has validated this workflow)"

  unit-and-contract:
    name: Java ${{ matrix.java }} verify
    runs-on: ubuntu-latest
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Install ddd4j 2.0.x SNAPSHOT (Aliyun repos + local install)
        uses: ./.github/actions/install-ddd4j
        with:
          java-version: ${{ matrix.java }}
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Verify (unit + contract)
        run: ./mvnw -B verify -Denforcer.skip=true

  broker-integration:
    name: Broker integration (${{ matrix.broker }})
    runs-on: ubuntu-latest
    needs: [workflow-lint, unit-and-contract]
    strategy:
      fail-fast: false
      matrix:
        broker:
          - activemq
          - disruptor
          - kafka
          - mqtt
          - mqtt-mica
          - nats
          - ons
          - pulsar
          - rabbitmq
          - redis-stream
          - rocketmq
          - sqs
          - tdmq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install ddd4j 2.0.x SNAPSHOT (Aliyun repos + local install)
        uses: ./.github/actions/install-ddd4j
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Enable Testcontainers reuse
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
      - name: Run broker integration tests (${{ matrix.broker }})
        run: ./mvnw -B verify -Pintegration -Denforcer.skip=true -pl ddd4j-quarkus-mq/ddd4j-quarkus-mq-${{ matrix.broker }} -am
      - name: Upload integration test reports (${{ matrix.broker }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ matrix.broker }}
          path: |
            **/target/failsafe-reports/*.txt
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14
