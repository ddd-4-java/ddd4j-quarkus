name: Verify Javadoc artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  javadoc:
    name: Strict Javadoc artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Maven and verify ddd4j snapshot
        uses: ./.github/actions/configure-maven
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Build strict Javadoc artifacts
        run: ./mvnw -B -U -Dmaven.repo.local="$DDD4J_QUARKUS_CI_REPO" -DskipTests clean compile javadoc:jar
      - name: Verify Javadoc archives
        run: ./scripts/verify-javadoc-jars.sh
