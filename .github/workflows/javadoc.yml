name: Verify Javadoc artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  javadoc:
    name: Strict Javadoc artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure Maven and verify ddd4j snapshot
        uses: ./.github/actions/configure-maven
        with:
          maven-settings-xml: ${{ secrets.MAVEN_SETTINGS_XML }}
      - name: Build strict Javadoc artifacts
        run: ./mvnw -B -DskipTests clean compile javadoc:jar
      - name: Verify Javadoc archives
        run: ./scripts/verify-javadoc-jars.sh
