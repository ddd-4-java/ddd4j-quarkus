# ddd4j-quarkus-sample-mq-rabbitmq 配置

# Quarkus HTTP 端口
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.index-dependency.mq-core.group-id=io.ddd4j.quarkus
quarkus.index-dependency.mq-core.artifact-id=ddd4j-quarkus-mq-core
quarkus.index-dependency.mq-broker.group-id=io.ddd4j.quarkus
quarkus.index-dependency.mq-broker.artifact-id=ddd4j-quarkus-mq-rabbitmq

# 启用 ddd4j MQ
ddd4j.mq.enabled=true

# 命名空间 / 默认 Topic
ddd4j.mq.namespace=quarkus-rabbitmq-sample
ddd4j.mq.default-topic=DEFAULT

# 当前 Broker 类型为 RabbitMQ（由 ddd4j-quarkus-mq-rabbitmq 提供 RabbitMQCdiProducer）
# 解析规则见 io.ddd4j.mq.registry.MQBrokerType#from：rabbit -> MQBrokerType.RABBIT
ddd4j.mq.broker=rabbit

# RabbitMQ 连接配置：兼容原 rabbit.* 配置，测试夹具直接覆盖 rabbitmq.*。
# 默认连接 localhost:5672，可通过环境变量覆盖
ddd4j.mq.rabbitmq.host=${ddd4j.mq.rabbit.host:${DDD4J_MQ_RABBIT_HOST:localhost}}
ddd4j.mq.rabbitmq.port=${ddd4j.mq.rabbit.port:${DDD4J_MQ_RABBIT_PORT:5672}}
ddd4j.mq.rabbitmq.username=${ddd4j.mq.rabbit.username:${DDD4J_MQ_RABBIT_USERNAME:guest}}
ddd4j.mq.rabbitmq.password=${ddd4j.mq.rabbit.password:${DDD4J_MQ_RABBIT_PASSWORD:guest}}
ddd4j.mq.rabbitmq.virtual-host=${ddd4j.mq.rabbit.virtual-host:${DDD4J_MQ_RABBIT_VHOST:/}}

# Topic Exchange 名称（生产者投递到该 Exchange，消费者按 routing key 绑定）
ddd4j.mq.rabbitmq.exchange=${ddd4j.mq.rabbit.exchange:ddd4j.mq.exchange}

# 是否持久化 Exchange / Queue
ddd4j.mq.rabbitmq.durable=${ddd4j.mq.rabbit.durable:true}
# exchange 由示例显式声明；queue/binding 由 RabbitMQClient 注册。
