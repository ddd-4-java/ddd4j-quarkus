# ddd4j-quarkus-sample-mq-rabbitmq 配置

# Quarkus HTTP 端口
quarkus.http.port=8080

# 启用 ddd4j MQ
ddd4j.mq.enabled=true

# 命名空间 / 默认 Topic
ddd4j.mq.namespace=quarkus-rabbitmq-sample
ddd4j.mq.default-topic=DEFAULT

# 当前 Broker 类型为 RabbitMQ（由 ddd4j-quarkus-mq-rabbitmq 提供 RabbitMQCdiProducer）
# 解析规则见 io.ddd4j.mq.registry.MQBrokerType#from：rabbit -> MQBrokerType.RABBIT
ddd4j.mq.broker=rabbit

# ===== RabbitMQ 连接配置（由 RabbitMQProperties 反射 setter 绑定）=====
# 默认连接 localhost:5672，可通过环境变量覆盖
ddd4j.mq.rabbit.host=${DDD4J_MQ_RABBIT_HOST:localhost}
ddd4j.mq.rabbit.port=${DDD4J_MQ_RABBIT_PORT:5672}
ddd4j.mq.rabbit.username=${DDD4J_MQ_RABBIT_USERNAME:guest}
ddd4j.mq.rabbit.password=${DDD4J_MQ_RABBIT_PASSWORD:guest}
ddd4j.mq.rabbit.virtual-host=${DDD4J_MQ_RABBIT_VHOST:/}

# Topic Exchange 名称（生产者投递到该 Exchange，消费者按 routing key 绑定）
ddd4j.mq.rabbit.exchange=ddd4j.mq.exchange

# 是否持久化 Exchange / Queue
ddd4j.mq.rabbit.durable=true

# 是否由 BrokerAdapter 自动声明 Exchange / Queue / Binding（首次连接时自动 declare）
ddd4j.mq.rabbit.auto-declare=true