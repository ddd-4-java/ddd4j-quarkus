# ddd4j-quarkus-sample-adapter 测试配置
# 测试环境无需数据库：关闭 DevServices 与 Hibernate ORM（分层示例默认使用内存仓储）
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.enabled=false

# @QuarkusTest 下 Arc 默认只索引应用模块自身；依赖模块（app 等）以目录形式在
# classpath 上，需显式加入 Jandex 索引，否则其中的 CDI Bean（OrderApplicationService/
# MapStruct 生成的 OrderMapperImpl）无法被发现
quarkus.index-dependency.app.group-id=io.ddd4j.quarkus
quarkus.index-dependency.app.artifact-id=ddd4j-quarkus-sample-app
