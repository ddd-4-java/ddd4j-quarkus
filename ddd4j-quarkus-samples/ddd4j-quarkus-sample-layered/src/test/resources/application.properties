# ddd4j-quarkus-sample-layered 测试配置
# 分层示例默认使用 LayeredSampleConfig 装配的内存仓储，测试无需数据库：
# 关闭 DevServices 与 Hibernate ORM（ddd4j-quarkus-data-panache 传递引入 Panache）
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.enabled=false

# @QuarkusTest 下 Arc 默认只索引应用模块自身；依赖模块（adapter/app 等）以目录形式在
# classpath 上，需显式加入 Jandex 索引，否则其中的 CDI Bean / JAX-RS 资源
# （OrderResource/OrderApplicationService/OrderMapperImpl 等）无法被发现
quarkus.index-dependency.adapter.group-id=io.ddd4j.quarkus
quarkus.index-dependency.adapter.artifact-id=ddd4j-quarkus-sample-adapter
quarkus.index-dependency.app.group-id=io.ddd4j.quarkus
quarkus.index-dependency.app.artifact-id=ddd4j-quarkus-sample-app
quarkus.index-dependency.client.group-id=io.ddd4j.quarkus
quarkus.index-dependency.client.artifact-id=ddd4j-quarkus-sample-client
